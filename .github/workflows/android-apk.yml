name: Android APK

# Not on every push: this takes ~15 minutes and the useful moment to run it is
# when you actually want a build to install, not on every commit.
on:
  workflow_dispatch:
    inputs:
      variant:
        description: 'release (smaller, optimised) or debug (faster to build)'
        type: choice
        options: [release, debug]
        default: release
      abi:
        description: 'CPU architectures to include. arm64-v8a covers every phone sold since ~2017 and is a third of the size.'
        type: choice
        options: [arm64-v8a, 'arm64-v8a,armeabi-v7a', universal]
        default: arm64-v8a
  push:
    tags: ['v*']

permissions:
  contents: write        # the build publishes the APK as a release asset

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Gradle 9 and AGP need 17; the runner's default can drift.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      # The native project is generated, never committed — app.json is the
      # source of truth, so android/ can't drift out of sync with it.
      - name: Generate the Android project
        env:
          EXPO_PUBLIC_GOOGLE_MAPS_KEY: ${{ secrets.EXPO_PUBLIC_GOOGLE_MAPS_KEY }}
          EXPO_PUBLIC_GOOGLE_PLACES_KEY: ${{ secrets.EXPO_PUBLIC_GOOGLE_PLACES_KEY }}
        run: npx expo prebuild --platform android --no-install

      - uses: gradle/actions/setup-gradle@v4

      - name: Build the APK
        working-directory: android
        env:
          EXPO_PUBLIC_GOOGLE_MAPS_KEY: ${{ secrets.EXPO_PUBLIC_GOOGLE_MAPS_KEY }}
          EXPO_PUBLIC_GOOGLE_PLACES_KEY: ${{ secrets.EXPO_PUBLIC_GOOGLE_PLACES_KEY }}
          # The template's 2 GB ceiling makes the RN release build thrash.
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g
          # Read through the environment rather than interpolated into the
          # script, so the input can never be read as shell.
          VARIANT: ${{ inputs.variant || 'release' }}
          ABI: ${{ inputs.abi || 'arm64-v8a' }}
        run: |
          task="assemble${VARIANT^}"
          # A universal APK carries native code for four architectures and comes
          # out at ~119 MB — over GitHub's 100 MB file limit, and a slow download
          # for a phone that can only ever run one of them.
          args=()
          if [ "$ABI" != universal ]; then
            args+=("-PreactNativeArchitectures=$ABI")
          fi
          echo "Running ./gradlew $task ${args[*]}"
          ./gradlew "$task" "${args[@]}" --no-daemon --stacktrace

      - name: Name the APK after the build
        id: apk
        run: |
          src=$(find android/app/build/outputs/apk -name '*.apk' -print -quit)
          test -n "$src" || { echo 'No APK was produced.' >&2; exit 1; }
          version=$(node -p "require('./app.json').expo.version")
          out="waypoint-${version}-${GITHUB_SHA::7}.apk"
          cp "$src" "$out"
          echo "path=$out" >> "$GITHUB_OUTPUT"
          ls -lh "$out"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.path }}
          path: ${{ steps.apk.outputs.path }}
          # Long enough to get it onto a phone without keeping it forever.
          retention-days: 30
          if-no-files-found: error

      # A workflow artifact is a zip behind a login, which is the wrong shape
      # for "install this on my phone". A release asset is a plain file on a
      # permanent URL, so the phone can just download and open it:
      #   .../releases/latest/download/waypoint.apk
      - name: Publish it as the latest release
        env:
          GH_TOKEN: ${{ github.token }}
          APK: ${{ steps.apk.outputs.path }}
        run: |
          cp "$APK" waypoint.apk
          version=$(node -p "require('./app.json').expo.version")
          notes=$(printf '%s\n' \
            "Waypoint $version — built from \`${GITHUB_SHA::7}\` on $(date -u '+%d %b %Y')." \
            "" \
            "**[Download waypoint.apk](https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/waypoint.apk)** — open it on the phone and allow installs from this source when Android asks." \
            "" \
            "Signed with the standard Android debug key, so Play Protect will warn on install; that is expected for a build shared this way and not a sign of anything wrong.")
          # A moving tag, so the download URL above never changes.
          gh release delete latest --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag 2>/dev/null || true
          gh release create latest waypoint.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Waypoint $version" \
            --notes "$notes"
          echo "Released: https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/waypoint.apk"
